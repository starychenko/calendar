name: Calendar checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calendar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:19118
      NEXT_PUBLIC_GA_ID: G-CALENDARTEST
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Validate Compose template
        run: CALENDAR_IMAGE=calendar:test docker compose -f deploy/compose.yaml config --quiet
      - name: Build production container
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=http://127.0.0.1:19118 --build-arg NEXT_PUBLIC_GA_ID=G-CALENDARTEST --tag calendar:test .
      - name: Start isolated container
        run: >-
          docker run -d --name calendar-test --memory=512m --cpus=1 --pids-limit=128
          --cap-drop=ALL --security-opt=no-new-privileges
          --publish 127.0.0.1:19118:3000 --env NODE_OPTIONS=--max-old-space-size=256 calendar:test
      - name: Wait for application
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19118/ > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs calendar-test
          exit 1
      - run: npm run test:e2e
        env:
          CALENDAR_E2E_EXTERNAL: "1"
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs calendar-test || true
          docker rm --force calendar-test || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
          retention-days: 7
